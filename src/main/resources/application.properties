# Spring Boot Configuration
spring.application.name=datalink-client

# Server Port (Dashboard)
# Values are loaded from environment variables (see .env file)
# Defaults are for local development only
server.port=${CLIENT_SERVER_PORT:8081}

# Live data: kafka (Kafka EXTERNAL or internal bootstrap) | gateway (STOMP from Datalink gateway) | both
client.live.source=${CLIENT_LIVE_SOURCE:kafka}
# JVM→gateway SockJS base, e.g. http://gateway:8080 when client runs in Docker with gateway on datalink-network
gateway.internal.stomp.base-url=${GATEWAY_INTERNAL_STOMP_URL:}
# Optional: browser-reachable gateway base for operators (shown in /api/config), e.g. http://datalink-host:3001
gateway.stomp.public-url=${GATEWAY_STOMP_PUBLIC_URL:}

# Kafka Configuration
# Default to internal Kafka for Docker, localhost for local dev
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
kafka.topic=${KAFKA_TOPIC:sensor-data}
kafka.group.id=${KAFKA_CONSUMER_GROUP_ID:client-app-group}

# Feature toggles (client service)
client.websocket.enabled=${CLIENT_WEBSOCKET_ENABLED:true}

# WebSocket Configuration
websocket.port=${CLIENT_WEBSOCKET_PORT:8887}

# Database Configuration (H2)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/sensor_data}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
# CWE-260: no default value — must be set explicitly via environment variable
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.h2.console.enabled=true
# Local dashboard store (always used by DatabaseService; keep separate from MSSQL dbwriter)
client.localdb.url=${CLIENT_LOCAL_DB_URL:jdbc:h2:file:./data/sensor_data}
client.localdb.driver-class-name=${CLIENT_LOCAL_DB_DRIVER_CLASS_NAME:org.h2.Driver}
# CWE-260: no default value — must be set explicitly via environment variable
client.localdb.username=${CLIENT_LOCAL_DB_USERNAME}
client.localdb.password=${CLIENT_LOCAL_DB_PASSWORD}

# Custom Application Properties
db.retention.days=${CLIENT_DB_RETENTION_DAYS:7}

# Optional: mirror Kafka payloads to Microsoft SQL Server (same columns as PostgreSQL realtime_analog)
dbwriter.enabled=${DBWRITER_ENABLED:false}
dbwriter.url=${DBWRITER_URL}
# CWE-260: no default value — must be set explicitly via environment variable
dbwriter.username=${DBWRITER_USERNAME}
dbwriter.password=${DBWRITER_PASSWORD}
dbwriter.table=${DBWRITER_TABLE:dbo.realtime_analog}

# Optional: republish consumed payloads to a second Kafka cluster (e.g. Redpanda). All settings use KAFKA_FORWARD_* only.
# When KAFKA_FORWARD_ENABLED=true, KAFKA_FORWARD_BROKERS, KAFKA_FORWARD_TOPIC, and KAFKA_FORWARD_CLIENT_ID are required.
# Do not reuse KAFKA_BOOTSTRAP_SERVERS / KAFKA_TOPIC — those are for the Datalink consumer only.
kafka.forward.enabled=${KAFKA_FORWARD_ENABLED:false}
kafka.forward.bootstrap.servers=${KAFKA_FORWARD_BROKERS:}
kafka.forward.topic=${KAFKA_FORWARD_TOPIC:}
kafka.forward.client.id=${KAFKA_FORWARD_CLIENT_ID:}
# CWE-260: no default value — must be set explicitly via environment variable
kafka.forward.username=${KAFKA_FORWARD_USERNAME}
kafka.forward.password=${KAFKA_FORWARD_PASSWORD}
kafka.forward.ssl.enabled=${KAFKA_FORWARD_SSL:false}
kafka.forward.sasl.mechanism=${KAFKA_FORWARD_SASL_MECHANISM:}
