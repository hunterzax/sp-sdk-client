# Spring Boot Configuration
spring.application.name=datalink-client

# Server Port (Dashboard)
server.port=8081

# Kafka Configuration
kafka.bootstrap.servers=xxxx:9092
kafka.topic=sensor-data
kafka.group.id=client-app-group

# WebSocket Configuration
websocket.port=8887

# Database Configuration (H2)
spring.datasource.url=jdbc:h2:file:./data/sensor_data
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# Custom Application Properties
db.retention.days=7

# Optional MSSQL mirror (realtime_analog-shaped: time, tagname, cur_value, avg_*, flag_fresh, hillow_state)
